<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenção | Juliane Dias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css?v=99percent">
</head>
<body class="bg-gray-950 text-green-400 h-screen flex flex-col items-center justify-center p-4 overflow-hidden relative">

    <div class="absolute inset-0 z-0 bg-grid-pattern pointer-events-none"></div>

    <div class="z-10 w-full max-w-2xl bg-gray-800 rounded-lg shadow-2xl border border-gray-700 overflow-hidden">
        
        <div class="bg-gray-700 px-4 py-2 flex items-center space-x-2 border-b border-gray-600">
            <div class="w-3 h-3 rounded-full bg-red-500"></div>
            <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
            <div class="w-3 h-3 rounded-full bg-green-500"></div>
            <span class="ml-4 text-xs text-gray-300 font-sans">bash — juliane@portfolio:~/deploy</span>
        </div>

        <div class="p-6 space-y-4">
            <div class="opacity-70">
                <p><span class="text-blue-400">➜</span> <span class="text-purple-400">~</span> npm install @juliane-dias/v2.0</p>
            </div>

            <div>
                <p><span class="text-blue-400">➜</span> <span class="text-purple-400">~</span> npm run deploy</p>
                <div class="text-yellow-300 mt-2">
                    <p>> Compilando assets...</p>
                    <p>> Finalizando processo... [99%]</p>
                </div>

                <div class="w-full h-8 bg-gray-900 rounded-full mt-4 mb-6 border border-gray-700 relative overflow-hidden">
                    <div class="rainbow-progress-bar h-full">
                        <div class="sparkle-effect"></div>
                    </div>
                </div>
            </div>

            <div class="mt-8 border-t border-gray-600 pt-6">
                <h1 class="text-2xl md:text-3xl font-bold text-white mb-2">
                    &lt;Página em Manutenção/&gt;
                </h1>
                <p class="text-gray-300 text-sm md:text-base leading-relaxed">
                    Atualizando a stack e aplicando melhorias no backend. Voltamos em breve.
                    <span class="cursor-blink"></span>
                </p>
            </div>

            <div class="mt-8">
                <a href="https://www.linkedin.com/in/diasjuliane/" target="_blank" 
                   class="inline-block px-6 py-3 font-bold text-white rounded-md bg-blue-600 btn-glow">
                    Conectar no LinkedIn
                </a>
            </div>
        </div>
    </div>
</body>
</html>
